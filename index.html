<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Scraper Media Pro HN | Extracción & Análisis Social</title>
  <meta name="description" content="Dashboard avanzado de extracción y análisis de publicaciones de Instagram, TikTok, X, Facebook y YouTube con modelo de sentimientos en Azure Databricks.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.45);
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }
    /* ── Dark mode global overrides ── */
    .dark body { background-color: #090d16; color: #f1f5f9; }
    .dark .bg-white { background-color: #0f172a !important; }
    .dark .bg-slate-50 { background-color: #090d16 !important; }
    .dark .bg-slate-100 { background-color: #1e293b !important; }
    .dark .border-slate-200 { border-color: #1e293b !important; }
    .dark .border-slate-100 { border-color: #1e293b !important; }
    .dark .border-t { border-color: #1e293b !important; }
    .dark .text-slate-900 { color: #f8fafc !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }
    .dark .text-slate-700 { color: #e2e8f0 !important; }
    .dark .text-slate-600 { color: #94a3b8 !important; }
    .dark .text-slate-500 { color: #64748b !important; }
    .dark textarea, .dark input[type="text"], .dark input[type="email"], .dark input[type="password"] {
      background-color: #0b1120 !important;
      border-color: #1e293b !important;
      color: #f1f5f9 !important;
    }
    .dark textarea::placeholder, .dark input::placeholder { color: #475569 !important; }
    .dark select { 
      background-color: #0f172a !important; 
      border-color: #1e293b !important; 
      color: #f1f5f9 !important; 
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
